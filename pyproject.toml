[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerdemain"
version = "0.1.0"
description = "Multi-source accounting integration and reconciliation system for Wave Accounting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
pdf = [
  "pdfplumber>=0.11",
  "pypdf>=4.0",
]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "mypy>=1.11",
]

[project.scripts]
ledgerdemain = "ledgerdemain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
exclude-newer = "P3D"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
