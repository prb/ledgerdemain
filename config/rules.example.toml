# Categorization rules evaluated in ascending `priority` order.
# Copy to `rules.toml` and customize for your vendors and Chart of Accounts.

[[rules]]
name = "Gusto Monthly Fee"
priority = 10
source = "grasshopper"
direction = "WITHDRAWAL"
description_regex = "(?i)gusto\\s*(fee|sub|invoice|monthly)"
account_key = "payroll_processing_fees"
notes = "Gusto software subscription / processing fee"

[[rules]]
name = "Bank Interest Earned"
priority = 15
source = "grasshopper"
direction = "DEPOSIT"
description_regex = "(?i)\\binterest\\b"
account_key = "interest_income"
notes = "Savings / Money Market interest earned"

# Example S-Corp owner benefits rules — adjust vendor regex/source for your administrator.
[[rules]]
name = "Officer / Shareholder Health Insurance (COBRA)"
priority = 17
source = "grasshopper"
direction = "WITHDRAWAL"
description_regex = "(?i)inspirafinancial"
account_key = "officer_health_insurance"
notes = "S-Corp officer/shareholder health insurance (COBRA)"

[[rules]]
name = "Officer / Shareholder HSA Contributions"
priority = 18
source = "grasshopper"
direction = "WITHDRAWAL"
description_regex = "(?i)hsa\\s*con\\s*t\\s*ribution"
account_key = "officer_hsa"
notes = "S-Corp officer/shareholder HSA contribution"

[[rules]]
name = "Cloud Hosting Vendors"
priority = 20
direction = "WITHDRAWAL"
description_regex = "(?i)(amazon\\s*web\\s*services|aws\\b|google\\s*cloud|gcp\\b|github|digitalocean|cloudflare|vercel|heroku)"
account_key = "cloud_hosting"

[[rules]]
name = "Software Subscriptions"
priority = 30
direction = "WITHDRAWAL"
description_regex = "(?i)(figma|slack|notion|linear|1password|openai|anthropic|zoom|google\\s*workspace|microsoft\\s*365)"
account_key = "software_subscriptions"

[[rules]]
name = "Software Refunds"
priority = 35
source = "capital_one"
direction = "DEPOSIT"
description_regex = "(?i)(figma|slack|notion|linear|github|aws|amazon\\s*web\\s*services)"
account_key = "software_subscriptions"
notes = "Vendor refund credited to expense account"

[[rules]]
name = "Bank & Wire Fees"
priority = 40
source = "grasshopper"
direction = "WITHDRAWAL"
description_regex = "(?i)(wire\\s*fee|service\\s*charge|bank\\s*fee|ach\\s*return\\s*fee)"
account_key = "bank_fees"

[[rules]]
name = "Travel & Lodging"
priority = 50
direction = "WITHDRAWAL"
description_regex = "(?i)(united\\s*air|delta\\s*air|american\\s*air|southwest|jetblue|alaska\\s*air|marriott|hilton|hyatt|airbnb|uber|lyft)"
account_key = "travel"
